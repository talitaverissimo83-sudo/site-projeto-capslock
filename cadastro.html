<main>

    <h1>Cadastrar Ordem de Serviço</h1>

    <p>Preencha os dados para cadastrar uma nova ordem de serviço.</p>

    <form>

        <p>Nome do cliente:</p>
        <input type="text">


        <p>Telefone:</p>
        <input type="text">


        <p>Equipamento:</p>
        <input type="text">


        <p>Problema:</p>
        <input type="text">


        <p>Descrição:</p>
        <textarea></textarea>


        <p>Status:</p>

        <select>
            <option>Em andamento</option>
            <option>Aguardando</option>
            <option>Concluída</option>
        </select>


        <br><br>

        <button>Cadastrar</button>

    </form>

</main>
